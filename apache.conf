<VirtualHost *:80>
    DocumentRoot /var/www/flarum/public

    <Directory /var/www/flarum/public>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>